; HTN 2026 badge — build config.
;
; Two environments:
;   badge   → the real hardware (ESP32-C3, Arduino framework)
;   native  → pure logic tests on your laptop, no board attached
;
; Library versions are pinned on purpose. Four people on a team with floating
; versions is how you lose an hour at 3am to a library that changed its API.

[platformio]
default_envs = badge

[env:badge]
platform  = espressif32@6.9.0
board     = esp32-c3-devkitm-1   ; ESP32-C3-MINI-1 module, matches the badge
framework = arduino

; Flash layout from the HAL guide §0: app 0x2A0000 @ 0x10000, storage 0x140000.
; The stock Arduino partition schemes do not match this and give you a smaller
; app partition — pinning it now avoids "binary no longer fits" at hour 6.
board_build.partitions    = partitions.csv
board_build.flash_mode    = dio
board_build.f_flash       = 80000000L
board_upload.flash_size   = 4MB

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, direct

build_flags =
  ; Libraries under lib/ do NOT inherit the project include/ directory, so
  ; badge_pins.h is unreachable from lib/Badge without this. Without it the
  ; build fails with "badge_pins.h: No such file or directory" and PlatformIO
  ; helpfully suggests searching its registry for it.
  -I include
  ; The console is USB-Serial-JTAG, NOT UART0 (§1.3). These two flags are what
  ; route Serial to the native USB port; without them Serial.print goes nowhere
  ; and you will think the board is dead.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  -Wall

lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit NeoPixel@^1.12.3

; ── Host-side tests ────────────────────────────────────────────────────────
; Only ButtonLogic is portable (no Arduino includes), so the hardware lib is
; ignored here. If a native test fails to link, you have accidentally pulled an
; Arduino header into pure logic — that is the test doing its job.
[env:native]
platform  = native
test_framework = unity
lib_ignore = Badge
build_flags = -std=gnu++17 -Wall

; ── Escape hatch ───────────────────────────────────────────────────────────
; BLE is the one thing Arduino cannot do well on this board: §8 requires
; trimming NimBLE buffers or it OOMs the heap, and those are compile-time
; sdkconfig options baked into the Arduino core. If BLE becomes part of the
; project, uncomment this and port — the pin header and ButtonLogic carry over
; unchanged, only lib/Badge gets rewritten.
;
; [env:badge_idf]
; platform  = espressif32@6.9.0
; board     = esp32-c3-devkitm-1
; framework = espidf
; board_build.partitions = partitions.csv
